name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: |
          pip install pytest
      - name: Run unit tests (identity-svc)
        run: |
          pip install -r backend/services/identity-svc/requirements.txt || true
          pytest -q backend/services/identity-svc/tests || true
      - name: Run unit tests (consent-svc)
        run: |
          pip install -r backend/services/consent-svc/requirements.txt || true
          pytest -q backend/services/consent-svc/tests || true
      - name: Run unit tests (files-svc)
        run: |
          pip install -r backend/services/files-svc/requirements.txt || true
          pytest -q backend/services/files-svc/tests || true
      - name: Run unit tests (model-gateway)
        run: |
          pip install -r backend/services/model-gateway/requirements.txt || true
          pytest -q backend/services/model-gateway/tests || true
      - name: Run unit tests (api-gateway)
        run: |
          pip install -r backend/services/api-gateway/requirements.txt || true
          pytest -q backend/services/api-gateway/tests || true








