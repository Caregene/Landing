version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: quay.io/minio/minio:RELEASE.2024-09-06T09-27-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  identity-svc:
    build: ./services/identity-svc
    env_file:
      - ./services/identity-svc/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/appdb
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
    ports:
      - "8001:8000"

  consent-svc:
    build: ./services/consent-svc
    env_file:
      - ./services/consent-svc/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/appdb
    depends_on: [postgres]
    ports:
      - "8002:8000"

  files-svc:
    build: ./services/files-svc
    env_file:
      - ./services/files-svc/.env.example
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: files
    depends_on: [minio]
    ports:
      - "8003:8000"

  model-gateway:
    build: ./services/model-gateway
    env_file:
      - ./services/model-gateway/.env.example
    environment:
      REDIS_URL: redis://redis:6379/1
    depends_on: [redis]
    ports:
      - "8004:8000"

  api-gateway:
    build: ./services/api-gateway
    env_file:
      - ./services/api-gateway/.env.example
    environment:
      IDENTITY_URL: http://identity-svc:8000
      CONSENT_URL: http://consent-svc:8000
      FILES_URL: http://files-svc:8000
      MODEL_URL: http://model-gateway:8000
    depends_on: [identity-svc, consent-svc, files-svc, model-gateway]
    ports:
      - "8080:8000"

volumes:
  pgdata:
  minio_data:








